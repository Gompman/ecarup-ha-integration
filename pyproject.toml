[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-ecarup"
version = "0.1.0"
description = "Home Assistant custom integration for the eCarUp charging API"
requires-python = ">=3.12"
dependencies = ["homeassistant>=2025.1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["custom_components*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
